# Labo paris : cycle quotidien des cotes Winamax FR (OddsPapi) et des suggestions de paris.
#
# - Le soir (10 h, 14 h, 17 h UTC) : rencontres des 8 compétitions, relevés des rencontres à venir
#   (/historical-odds, non décompté), historiques des matchs terminés, vues, appariement, suggestions et
#   journal (immuable), export de l'artefact lu par l'onglet « Matchs à venir ».
# - Le matin (06 h 30 UTC) : résultats de la veille (tableau de scores public ESPN, sans clé), règlement
#   des suggestions publiées, historique des soirées avec cumul, export.
# Les deux publient l'archive dans la release privée `betting-odds` du dépôt de données et l'artefact des
# suggestions dans `scoutvision-data.tar.gz` lue par le serveur.
#
# Secrets : ODDSPAPI_API_KEY (sans lui, les étapes de cotes sont sautées avec un avertissement, le reste
# tourne), PITCHAPI_DATA_TOKEN (releases privées). La clé n'apparaît dans aucun journal.
name: Labo paris — cotes et suggestions

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 10,14,17 * * *"

permissions:
  contents: read

concurrency:
  group: betting-odds
  cancel-in-progress: false

jobs:
  labo-paris:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DATA_REPO: Cordierarn/PitchApi-big-5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dépendances
        run: |
          pip install --quiet numpy pandas pyarrow scipy requests
          npm ci --ignore-scripts

      - name: Données ScoutVision (prévisions du pipeline et résultats)
        env:
          PITCHAPI_DATA_TOKEN: ${{ secrets.PITCHAPI_DATA_TOKEN }}
        run: npm run data:pull

      - name: Archive précédente du Labo (release privée betting-odds)
        env:
          GH_TOKEN: ${{ secrets.PITCHAPI_DATA_TOKEN }}
        run: |
          mkdir -p .research/betting
          id="$(gh api "repos/$DATA_REPO/releases/tags/betting-odds" -q '.assets[] | select(.name == "betting-odds.tar.gz") | .id' 2>/dev/null || true)"
          if [ -n "$id" ]; then
            gh api -H "Accept: application/octet-stream" "repos/$DATA_REPO/releases/assets/$id" > betting-odds.tar.gz
            tar -xzf betting-odds.tar.gz -C .research/betting
            echo "archive restaurée"
          else
            echo "aucune archive : premier passage"
          fi

      - name: Résultats détaillés PitchAPI et artefacts de phase 2 (créés au premier passage)
        run: |
          cd scripts
          python3 -m betting.results
          if [ ! -f ../.research/betting/phase2/variant.json ]; then python3 -m betting.phase2 variant; fi
          if [ ! -f ../.research/betting/phase2/calibration.json ]; then python3 -m betting.phase2 calibrate; fi
          if [ ! -f ../.research/betting/phase2/adjustment.json ]; then python3 -m betting.adjust; fi

      - name: Cotes Winamax (rencontres, relevés à venir, historiques, vues, appariement)
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          if [ -z "$ODDSPAPI_API_KEY" ]; then echo "::warning::Secret ODDSPAPI_API_KEY absent : étapes de cotes sautées."; exit 0; fi
          cd scripts
          python3 -m betting.fetch fixtures --from "$(date -u -d '-1 day' +%F)" --to "$(date -u -d '+9 days' +%F)"
          python3 -m betting.fetch upcoming --days 7
          python3 -m betting.fetch history --max-requests 400
          python3 -m betting.fetch views
          python3 -m betting.fetch match
          python3 -m betting.fetch status

      - name: Résultats de la veille (ESPN) et règlement
        run: |
          cd scripts
          python3 -m betting.results_web --date "$(date -u -d '-1 day' +%F)"
          python3 -m betting.results_web --date "$(date -u +%F)" || true

      - name: Suggestions, journal, bilan, historique des soirées, export
        run: |
          cd scripts
          if [ ! -f ../.research/betting/product/bilan.json ]; then python3 -m betting.product replay || echo "::warning::rejeu impossible (archive de cotes incomplète)"; fi
          python3 -m betting.product suggest
          python3 -m betting.evening auto --date "$(date -u -d '-1 day' +%F)"
          python3 -m betting.evening settle --date "$(date -u -d '-1 day' +%F)"
          python3 -m betting.product export

      - name: Publication de l'archive du Labo (release privée)
        env:
          GH_TOKEN: ${{ secrets.PITCHAPI_DATA_TOKEN }}
        run: |
          cd .research/betting
          tar -czf ../../betting-odds.tar.gz $(ls -d odds views journal product phase2 fixtures.parquet matches.parquet match_failures.parquet aliases.json quota.json results.parquet results_web.parquet markets_catalogue.json 2>/dev/null)
          cd ../..
          gh release view betting-odds --repo "$DATA_REPO" >/dev/null 2>&1 || gh release create betting-odds --repo "$DATA_REPO" --title "Labo paris — archive de cotes" --notes "Archive privée du Labo paris (cotes Winamax FR via OddsPapi, journal, historique des soirées), mise à jour par betting-odds.yml" --prerelease
          gh release upload betting-odds betting-odds.tar.gz --repo "$DATA_REPO" --clobber

      - name: Publication des suggestions dans l'archive de données du serveur
        env:
          GH_TOKEN: ${{ secrets.PITCHAPI_DATA_TOKEN }}
        run: |
          id="$(gh api "repos/$DATA_REPO/releases/tags/scoutvision-data" -q '.assets[] | select(.name == "scoutvision-data.tar.gz") | .id')"
          gh api -H "Accept: application/octet-stream" "repos/$DATA_REPO/releases/assets/$id" > scoutvision-data.tar.gz
          mkdir -p data-release && tar -xzf scoutvision-data.tar.gz -C data-release
          mkdir -p data-release/forecast/suggestions && cp public/data/forecast/suggestions/index.json data-release/forecast/suggestions/index.json
          tar -czf scoutvision-data.tar.gz -C data-release .
          gh release upload scoutvision-data scoutvision-data.tar.gz --repo "$DATA_REPO" --clobber
