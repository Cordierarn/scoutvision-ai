name: Mise à jour des données ScoutVision

# Prépare les données de l'app depuis les releases de PitchApi-big-5 et les publie
# dans la release privée `scoutvision-data` de ce même dépôt de données.
# Ce dépôt est public : rien n'est commité ici, aucun artefact ni cache ne contient
# les données, et les logs n'affichent que des noms d'archives et des effectifs.
# En local : `npm run data:pull`.

on:
  schedule:
    # PitchApi-big-5 met à jour ses données le lundi et le vendredi à 08:00 UTC (60 min max)
    - cron: "30 10 * * 1"
    - cron: "30 10 * * 5"
  workflow_dispatch:
  # Déclenchement immédiat depuis le workflow de PitchApi-big-5 (voir README)
  repository_dispatch:
    types: [pitchapi-data-updated]

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  DATA_REPO: Cordierarn/PitchApi-big-5
  DATA_RELEASE: scoutvision-data
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Fine-grained PAT limité à PitchApi-big-5, Contents : Read and write
      GH_TOKEN: ${{ secrets.PITCHAPI_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Vérification du secret
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Le secret PITCHAPI_DATA_TOKEN n'est pas défini (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Installation
        run: pip install -r scripts/requirements.txt

      - name: Préparation des données
        # Lit aussi market_value.parquet (Transfermarkt) dans la release scoutvision-data
        run: python scripts/prepare_data.py

      - name: Laboratoire
        # Expériences sur les tables match par match (archives déjà en cache) : public/data/lab
        run: python scripts/prepare_lab.py

      - name: Recherche prévision — dataset point-in-time, prévisions figées, replays de saison
        # Rien de .research n'est publié : seul l'export compact public/data/forecast/replays l'est.
        # Les cotes football-data (benchmark marché historique) sont téléchargées ici si le domaine répond.
        run: |
          cd scripts
          python3 -m backtest.build --download-odds
          python3 -m backtest.run_models --phase all
          # market_benchmark lève FileNotFoundError sans CSV (odds.load_directory ignore les fichiers absents) :
          # le cas « football-data n'a pas répondu » est testé ici ; toute autre erreur garde sa trace et son code.
          if ls ../.cache/pitchapi/football-data/*.csv >/dev/null 2>&1; then
            python3 -m backtest.market_benchmark --odds-dir ../.cache/pitchapi/football-data \
              || { rc=$?; echo "::warning::benchmark marché non calculé (code de sortie $rc, trace ci-dessus) : replays publiés sans référence marché"; }
          else
            echo "::warning::aucun CSV football-data dans le cache (téléchargement échoué, voir backtest.build ci-dessus) : replays publiés sans référence marché"
          fi
          python3 -m backtest.season_replay
          python3 -m backtest.export_replays

      - name: Amorce du Labo paris (résultats détaillés, variante, calibration, ajustements, porte de validation)
        # Publiée dans la release privée betting-odds : le workflow quotidien du Labo n'a pas besoin du cache PitchAPI
        run: |
          cd scripts
          python3 -m betting.results
          python3 -m betting.phase2 variant
          python3 -m betting.phase2 calibrate
          python3 -m betting.adjust
          # Sans replay_market.parquet, gate.py reprend lui-même la catégorie A précédente et sort en 0 : ici, seules
          # les vraies erreurs arrivent, avec leur trace ; l'amorce part alors sans pool_weights.json recalculé.
          python3 -m betting.gate --write \
            || { rc=$?; echo "::warning::porte de validation non recalculée (code de sortie $rc, trace ci-dessus) : amorce publiée sans pool_weights.json recalculé, le cycle quotidien la recalcule"; }
          cd ..
          tar -czf "$RUNNER_TEMP/betting-seed.tar.gz" .research/forecast/predictions .research/forecast/replay_pitchapi.parquet .research/forecast/replay_pitchapi.meta.json $(ls .research/forecast/replay_market.parquet 2>/dev/null) .research/betting/results.parquet .research/betting/phase2
          gh release view betting-odds -R "$DATA_REPO" >/dev/null 2>&1 || gh release create betting-odds -R "$DATA_REPO" --latest=false --prerelease --title "Labo paris — archive de cotes" --notes "Archive privée du Labo paris (amorce, cotes Winamax FR via OddsPapi, journal, historique des soirées)."
          gh release upload betting-odds "$RUNNER_TEMP/betting-seed.tar.gz" -R "$DATA_REPO" --clobber

      - name: Publication dans la release privée
        # Les suggestions du Labo paris (forecast/suggestions) sont ajoutées à l'archive par betting-odds.yml :
        # on reprend celles de l'archive en ligne pour ne pas les effacer jusqu'au prochain passage du Labo.
        run: |
          if gh release download "$DATA_RELEASE" -R "$DATA_REPO" -p scoutvision-data.tar.gz -D "$RUNNER_TEMP/previous" --clobber; then
            if tar -xzf "$RUNNER_TEMP/previous/scoutvision-data.tar.gz" -C public/data --wildcards "*forecast/suggestions/*"; then
              echo "Suggestions du Labo paris reprises de l'archive en ligne"
            else
              echo "::warning::suggestions du Labo paris non reprises de l'archive en ligne (code de sortie $?, trace ci-dessus) : absentes de la publication jusqu'au prochain passage du Labo"
            fi
          else
            echo "::warning::archive scoutvision-data précédente non téléchargée (code de sortie $?, trace ci-dessus) : première publication, ou release indisponible ; suggestions du Labo paris absentes jusqu'au prochain passage du Labo"
          fi
          tar -czf "$RUNNER_TEMP/scoutvision-data.tar.gz" -C public/data .
          if ! gh release view "$DATA_RELEASE" -R "$DATA_REPO" >/dev/null 2>&1; then
            gh release create "$DATA_RELEASE" -R "$DATA_REPO" --latest=false \
              --title "Données ScoutVision" \
              --notes "Données préparées pour l'app ScoutVision par Cordierarn/scoutvision-ai (scripts/prepare_data.py). Récupération : npm run data:pull."
          fi
          gh release upload "$DATA_RELEASE" "$RUNNER_TEMP/scoutvision-data.tar.gz" -R "$DATA_REPO" --clobber

      - name: Résumé
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          index = json.load(open("public/data/index.json"))
          print(f"### Données ScoutVision du {index['generatedAt']}\n")
          print("| Saison | Joueurs | Équipes | Compétitions |\n|---|---|---|---|")
          for s in index["seasons"]:
              print(f"| {s['id']} | {s['players']} | {s['teams']} | {len(s['competitions'])} |")
          PY
