# ScoutVision - déploiement privé sur Render (Blueprint : New > Blueprint, ce dépôt)
# Un seul service web Node : application, page de connexion, données privées, /cdn et API Gemini
# derrière le même garde d'accès (server/privateServer.ts). Voir docs/deployment.md.
# Les secrets ne sont JAMAIS écrits ici : « sync: false » les fait saisir dans le tableau de bord.
services:
  - type: web
    name: scoutvision
    runtime: node
    plan: free            # starter (7 $/mois) : pas de mise en veille après 15 minutes d'inactivité
    region: frankfurt
    branch: main
    autoDeploy: true
    # devDependencies nécessaires au build (Vite, TypeScript) malgré NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: SCOUTVISION_AUTH_USER
        value: arnaud
      - key: SCOUTVISION_AUTH_PASSWORD_HASH
        sync: false
      - key: SCOUTVISION_SESSION_SECRET
        sync: false
      - key: PITCHAPI_DATA_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
